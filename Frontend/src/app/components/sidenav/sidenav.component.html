<!-- <div class="h-screen transition-all duration-300 shadow-lg fixed top-0 left-0 flex flex-col rounded-2xl bg-[#111827]" -->
<div class="transition-all duration-300 shadow-lg fixed top-4 left-4 h-[calc(100vh-2rem)] flex flex-col rounded-2xl bg-[#142f46] z-10"
    [ngClass]="collapsed ? 'w-20' : 'w-64'">     
    
    <!-- Logo container -->
    <div class="flex items-center justify-between p-4 border-b" [ngStyle]="{'border-color': 'rgba(23, 169, 224, 0.2)'}">
        <!-- Logo T (visible solo cuando está colapsado) -->
        <button *ngIf="collapsed" 
                class="flex items-center justify-center w-8 h-8 rounded transition-all duration-200 hover:scale-110" 
                [ngStyle]="{'background-color': '#142f46'}"
                (click)="toggleCollapse()">
            <img src="TEDEXIS T.png" alt="Logo" class="w-9 h-9 object-contain" />
        </button>
   
        <!-- Logo TEDEXIS completo (visible solo cuando no está colapsado y con funcionalidad de toggle) -->
        <div *ngIf="!collapsed" class="flex-1 cursor-pointer transition-all duration-200 hover:opacity-80" (click)="toggleCollapse()">
            <img src="https://www.tedexis.com/wp-content/uploads/2024/06/logo-tipografia-tedexis2-.png"
            alt="TEDEXIS Logo"
            class="h-9 object-contain filter brightness-0 invert" />
        </div>
   
        <!-- Botón de cerrar sidebar (colapsa el sidebar) -->
        <button class="transition-all duration-200 hover:scale-110" 
                style="color: #17A9E0;"
                *ngIf="!collapsed" 
                (click)="toggleCollapse()">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
   
    <!-- Navigation menu -->
    <div class="mt-4 flex-1 overflow-y-auto pb-24">
        <ul>
            <li class="relative" *ngFor="let data of navData"
                [ngClass]="collapsed ? 'px-2' : 'px-3'">
                <a
                    class="nav-item flex items-center rounded-lg transition-all duration-200 cursor-pointer text-white"
                    [ngClass]="collapsed ? 'py-3 justify-center' : 'py-3 px-3'"
                    [routerLink]="[data.routeLink]"
                    routerLinkActive="nav-item-active rounded-lg font-semibold"
                    [routerLinkActiveOptions]="{ exact: true }"
                >
                    <img [src]="data.icon" alt="{{ data.label }} icon" class="w-6 h-6 object-contain flex-shrink-0" 
                        [ngStyle]="{'filter': 'brightness(0) saturate(100%) invert(56%) sepia(83%) saturate(1795%) hue-rotate(180deg) brightness(100%) contrast(100%)'}">
                    <span class="ml-3 text-sm font-medium" *ngIf="!collapsed">{{data.label}}</span>
                    <div class="absolute right-0 top-0 bottom-0 w-1 rounded-r-lg nav-indicator" 
                        *ngIf="true"
                        style="background-color: #17A9E0;"></div>
                </a>
            </li>
        </ul>
    </div>

    <!-- Botón de Cerrar sesión fijo en la parte inferior -->
    <div class="p-4 border-t absolute bottom-0 w-full flex justify-center" 
        [ngStyle]="{'border-color': 'rgba(23, 169, 224, 0.2)'}">

        <button (click)="logout()"
            class="logout-button text-white font-medium transition-all duration-200 rounded-lg flex items-center justify-center"
            [ngClass]="{
                'w-12 h-12': collapsed,
                'w-full py-3 px-4': !collapsed
            }">

            <svg xmlns="http://www.w3.org/2000/svg"
                [ngClass]="collapsed ? 'h-6 w-6' : 'h-5 w-5'"
                class="flex-shrink-0"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V5m-6 5v4" />
            </svg>

            <span *ngIf="!collapsed" class="ml-3 text-sm">Cerrar sesión</span>

        </button>
    </div>
