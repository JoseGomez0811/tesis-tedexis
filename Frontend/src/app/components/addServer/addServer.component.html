<div class="max-w-4xl mx-auto p-6 bg-white">
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Añadir Servidor</h1>
        <p class="text-gray-600">Configura los parámetros de tu servidor</p>
    </div>

    <form class="space-y-8" (ngSubmit)="onSubmit($event)">
        <!-- Server Section -->
        <div class="bg-gray-50 rounded-lg p-6">
            <h2 class="text-xl font-medium text-gray-900 mb-2">Servidor</h2>
            <p class="text-gray-600 mb-6">Ingrese los parámetros necesarios para registrar un nuevo servidor</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre del servidor
                    </label>
                    <input
                            type="text"
                            id="nombre"
                            [(ngModel)]="nombre"
                            name="nombre"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Calidad"
                        >
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Dirección IP
                    </label>
                    <input
                            type="text"
                            id="ip"
                            [(ngModel)]="ip"
                            name="ip"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="10.10.25.63"
                        >
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Puerto de Enlace
                    </label>
                    <input
                            type="text"
                            id="puerto"
                            [(ngModel)]="puerto"
                            name="puerto"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="8080"
                        >
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button
                type="submit"
                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200"
            >
                Añadir Servidor
            </button>
        </div>
    </form>
</div>
