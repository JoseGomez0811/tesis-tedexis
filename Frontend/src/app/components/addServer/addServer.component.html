<div class="max-w-4xl mx-auto p-6 bg-white">
    <!-- ✅ Alerta tipo TOAST -->
    <div
        *ngIf="alertVisible"
        [ngClass]="{
        'bg-green-100 border-l-4 border-green-500 text-green-700': alertType === 'success',
        'bg-orange-100 border-l-4 border-orange-500 text-orange-700': alertType === 'error'
        }"
        class="fixed top-4 left-1/2 transform -translate-x-1/2 w-11/12 md:w-1/2 p-4 rounded-md shadow-lg transition-all duration-500 ease-in-out z-50"
        [class.opacity-100]="alertVisible"
        [class.opacity-0]="!alertVisible"
        role="alert"
    >
        <div class="flex justify-between items-start">
        <div>
            <p class="font-bold">
            {{ alertType === 'success' ? 'Éxito' : 'Error' }}
            </p>
            <p>{{ alertMessage }}</p>
        </div>

        <!-- Botón para cerrar manualmente -->
        <button
            (click)="closeAlert()"
            class="text-gray-500 hover:text-gray-700 ml-4"
        >
            ✖
        </button>
        </div>
    </div>
    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Añadir Servidor</h1>
        <p class="text-gray-600">Configura los parámetros de tu servidor</p>
    </div>

    <form class="space-y-8" (ngSubmit)="onSubmit($event)">
        <!-- Server Section -->
        <div class="bg-gray-50 rounded-lg p-6">
            <h2 class="text-xl font-medium text-gray-900 mb-2">Servidor</h2>
            <p class="text-gray-600 mb-6">Ingrese los parámetros necesarios para registrar un nuevo servidor</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre del servidor
                    </label>
                    <input
                            type="text"
                            id="nombre"
                            [(ngModel)]="nombre"
                            name="nombre"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Calidad"
                        >
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Dirección IP
                    </label>
                    <input
                            type="text"
                            id="ip"
                            [(ngModel)]="ip"
                            name="ip"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="10.10.25.63"
                        >
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button
                type="submit"
                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200"
            >
                Añadir Servidor
            </button>
        </div>
    </form>
</div>
