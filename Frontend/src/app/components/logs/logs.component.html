<div class="max-w-6xl mx-auto p-6 bg-white">
  <!-- Título principal -->
  <div class="mb-8">
    <h1 class="text-3xl font-semibold text-gray-900 mb-2">Perfil de Usuario</h1>
    <p class="text-gray-600">Visualiza tu perfil y revisa el historial de simulaciones realizadas</p>
  </div>

  <!-- Sección de Historial -->
  <div class="bg-gray-50 rounded-lg p-6 space-y-6">
    <h2 class="text-xl font-medium text-gray-900">Historial de Simulaciones</h2>

    <!-- 🔹 Filtros -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Filtro por Usuario -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Filtrar por Usuario</label>
        <select [(ngModel)]="filtroUsuario" name="filtroUsuario"
                (change)="applyFilters()"
                class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring focus:ring-blue-500">
          <option value="">Todos</option>
          <option *ngFor="let user of userList" [value]="user.name">{{ user.name }}</option>
        </select>
      </div>

      <!-- Filtro por Fecha -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Filtrar por Fecha</label>
        <select [(ngModel)]="filtroFecha" name="filtroFecha"
                (change)="applyFilters()"
                class="w-full px-3 py-2 border border-gray-300 rounded-md bg-white focus:outline-none focus:ring focus:ring-blue-500">
          <option value="">Todas</option>
          <option value="hoy">Hoy</option>
          <option value="semana">Esta semana</option>
          <option value="mes">Este mes</option>
          <option value="año">Este año</option>
          <option value="personalizada">Fecha específica</option>
        </select>

        <!-- Input de fecha específica -->
        <div *ngIf="filtroFecha === 'personalizada'" class="mt-3">
          <input
            type="date"
            [(ngModel)]="fechaEspecifica"
            (change)="applyFilters()"
            name="fechaEspecifica"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring focus:ring-blue-500"
          />
        </div>
      </div>
    </div>

    <!-- 🔹 Tabla de Simulaciones -->
    <div class="mt-6">
      <div *ngIf="filteredLogs.length > 0; else noSimulations" class="border border-gray-200 rounded-xl overflow-hidden shadow-inner">
        <div class="overflow-x-auto overflow-y-auto max-h-72">
          <table class="min-w-full divide-y divide-gray-200 text-sm">
            <thead class="bg-gray-100 sticky top-0 shadow-sm">
              <tr>
                <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase">Usuario</th>
                <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase">Descripción</th>
                <th class="px-6 py-3 text-left font-bold text-gray-600 uppercase">Fecha</th>
              </tr>
            </thead>

            <tbody class="bg-white divide-y divide-gray-200">
              <tr
                *ngFor="let log of filteredLogs"
                class="cursor-pointer hover:bg-gray-50 transition duration-150"
              >
                <td class="px-6 py-3 text-gray-800 font-medium">{{ getUser(log) }}</td>
                <td class="px-6 py-3 text-gray-800 font-medium">{{ getDescription(log) || '—' }}</td>
                <td class="px-6 py-3 text-gray-800 font-medium">{{ getDate(log) || '—' }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <ng-template #noSimulations>
        <div class="mt-4 p-4 text-center text-gray-500 bg-gray-100 rounded-lg border border-dashed border-gray-300">
          No se encontraron registros en tu historial.
        </div>
      </ng-template>
    </div>
  </div>
</div>
