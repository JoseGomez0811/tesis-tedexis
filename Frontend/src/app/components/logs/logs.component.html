<!-- 🔵 FONDO OSCURO GLOBAL -->
<div class="min-h-screen w-full bg-[#F2F3F7] p-4">

  <!-- ⚪ CONTENEDOR BLANCO (similar al de la imagen) -->
  <div 
    class="fixed top-4 bottom-4 right-4 bg-white rounded-2xl shadow-lg p-6 overflow-y-auto overflow-x-hidden animate-fade-in transition-all duration-300 ease-in-out"
    [ngClass]="{ 
      'left-[calc(5rem+2rem)]': isSideNavCollapsed, 
      'left-[calc(16rem+2rem)]': !isSideNavCollapsed 
    }"
    style="max-height: calc(100vh - 2rem);">

  <!-- Mejorado: Título principal con mejor jerarquía y colores corporativos -->
  <div class="flex justify-between items-start mb-8">
    <div>
      <h1 class="text-5xl font-extrabold text-[#214F90] mb-2">Historial de Actividades</h1>
      <p class="text-gray-600 text-sm font-medium">
        Visualiza y filtra el historial completo de actividades registradas
      </p>
    </div>
  </div>

  <!-- Sección mejorada con mejor diseño y espaciado -->
  <div class="bg-white rounded-xl p-8 space-y-8 border border-gray-200 hover:border-[#17A9E0] hover:shadow-md transition-all">
    
    <!-- Filtros rediseñados con colores corporativos y mejor estructura -->
    <div>
      <h2 class="text-xl font-bold text-[#214F90] mb-6 flex items-center gap-2">
        <span class="w-1 h-6 bg-gradient-to-b from-[#214F90] to-[#17A9E0] rounded"></span>
        Filtros
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Filtro por Usuario -->
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-3">Filtrar por Usuario</label>
          <select [(ngModel)]="filtroUsuario" name="filtroUsuario"
                  (change)="applyFilters()"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white text-gray-900 font-medium focus:outline-none focus:border-[#17A9E0] focus:ring-2 focus:ring-[#17A9E0] focus:ring-opacity-20 transition duration-200">
            <option value="">Todos los usuarios</option>
            <option *ngFor="let user of userList" [value]="user.name">{{ user.name }}</option>
          </select>
        </div>

        <!-- Filtro por Fecha -->
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-3">Filtrar por Fecha</label>
          <select [(ngModel)]="filtroFecha" name="filtroFecha"
                  (change)="applyFilters()"
                  class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white text-gray-900 font-medium focus:outline-none focus:border-[#17A9E0] focus:ring-2 focus:ring-[#17A9E0] focus:ring-opacity-20 transition duration-200">
            <option value="">Todas las fechas</option>
            <option value="hoy">Hoy</option>
            <option value="semana">Esta semana</option>
            <option value="mes">Este mes</option>
            <option value="año">Este año</option>
            <option value="personalizada">Fecha específica</option>
            <option value="año_especifico">Año específico</option>
            <option value="mes_año_especifico">Mes y año específico</option>
          </select>
        </div>
      </div>

      <!-- Input de fecha personalizada -->
      <div *ngIf="filtroFecha === 'personalizada'" class="animate-fadeIn mt-6">
        <label class="block text-sm font-semibold text-gray-900 mb-3">Seleccionar fecha</label>
        <input
          type="date"
          [(ngModel)]="fechaEspecifica"
          (change)="applyFilters()"
          (keydown.enter)="$event.preventDefault()"
          name="fechaEspecifica"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white text-gray-900 font-medium focus:outline-none focus:border-[#17A9E0] focus:ring-2 focus:ring-[#17A9E0] focus:ring-opacity-20 transition duration-200"
        />
      </div>

      <!-- Input de año específico -->
      <div *ngIf="filtroFecha === 'año_especifico'" class="animate-fadeIn mt-6">
        <label class="block text-sm font-semibold text-gray-900 mb-3">Seleccionar año</label>
        <input
          type="number"
          [(ngModel)]="anioEspecifico"
          name="anioEspecifico"
          (input)="applyFilters()"
          (change)="applyFilters()"
          (keydown.enter)="$event.preventDefault()"
          min="2000"
          max="2100"
          placeholder="Ej: 2024"
          class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white text-gray-900 font-medium focus:outline-none focus:border-[#17A9E0] focus:ring-2 focus:ring-[#17A9E0] focus:ring-opacity-20 transition duration-200"
        />
      </div>

      <!-- Input de mes y año específico -->
      <div *ngIf="filtroFecha === 'mes_año_especifico'" class="animate-fadeIn mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-3">Seleccionar mes</label>
          <select
            [(ngModel)]="mesEspecifico"
            name="mesEspecifico"
            (change)="applyFilters()"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white text-gray-900 font-medium focus:outline-none focus:border-[#17A9E0] focus:ring-2 focus:ring-[#17A9E0] focus:ring-opacity-20 transition duration-200"
          >
            <option value="">Seleccionar mes</option>
            <option value="1">Enero</option>
            <option value="2">Febrero</option>
            <option value="3">Marzo</option>
            <option value="4">Abril</option>
            <option value="5">Mayo</option>
            <option value="6">Junio</option>
            <option value="7">Julio</option>
            <option value="8">Agosto</option>
            <option value="9">Septiembre</option>
            <option value="10">Octubre</option>
            <option value="11">Noviembre</option>
            <option value="12">Diciembre</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-3">Seleccionar año</label>
          <input
            type="number"
            [(ngModel)]="anioMesEspecifico"
            name="anioMesEspecifico"
            (input)="applyFilters()"
            (change)="applyFilters()"
            (keydown.enter)="$event.preventDefault()"
            min="2000"
            max="2100"
            placeholder="Ej: 2024"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg bg-white text-gray-900 font-medium focus:outline-none focus:border-[#17A9E0] focus:ring-2 focus:ring-[#17A9E0] focus:ring-opacity-20 transition duration-200"
          />
        </div>
      </div>
    </div>

    <!-- Tabla rediseñada con colores corporativos y mejor diseño -->
    <div class="mt-8">
      <div *ngIf="filteredLogs.length > 0; else noSimulations" class="border-2 border-gray-200 rounded-xl overflow-hidden shadow-lg">
        <div class="overflow-x-auto overflow-y-auto max-h-[500px]">
          <table class="w-full divide-y divide-gray-200 text-sm table-fixed">
            <colgroup>
              <col style="width: 200px;">
              <col style="width: auto;">
              <col style="width: 200px;">
            </colgroup>
            <!-- Header con gradiente corporativo -->
            <thead class="bg-[#F2F3F7] sticky top-0 z-10 shadow-md">
              <tr>
                <th class="px-6 py-5 text-center font-bold text-black uppercase tracking-wide">Usuario</th>
                <th class="px-6 py-5 text-center font-bold text-black uppercase tracking-wide">Descripción</th>
                <th class="px-6 py-5 text-center font-bold text-black uppercase tracking-wide">Fecha</th>
              </tr>
            </thead>

            <!-- Body mejorado con mejor hover y espaciado -->
            <tbody class="bg-white divide-y divide-gray-100">
              <tr
                *ngFor="let log of filteredLogs"
                class="cursor-pointer border-gray-200 hover:border-[#17A9E0] hover:shadow-md transition-all"
              >
                <td class="px-6 py-5 text-center text-gray-900 font-semibold break-words align-top">{{ getUser(log) }}</td>
                <td class="px-6 py-5 text-center text-gray-700 font-medium break-words align-top">{{ getDescription(log) || '—' }}</td>
                <td class="px-6 py-5 text-center text-gray-700 font-medium break-words align-top">{{ getDate(log) || '—' }}</td>
              </tr>
            </tbody>
            <!-- <tbody
              class="bg-white divide-y divide-gray-100 
                    [&>tr]:cursor-pointer 
                    [&>tr]:transition 
                    [&>tr]:duration-200 
                    [&>tr]:border-l-4 
                    [&>tr]:border-l-transparent
                    [&>tr:hover]:bg-gradient-to-r
                    [&>tr:hover]:from-blue-50
                    [&>tr:hover]:to-transparent
                    [&>tr:hover]:border-l-[#17A9E0]"
            >
              <tr *ngFor="let log of filteredLogs">
                <td class="px-6 py-4 text-gray-900 font-semibold">{{ getUser(log) }}</td>
                <td class="px-6 py-4 text-gray-700 font-medium">{{ getDescription(log) || '—' }}</td>
                <td class="px-6 py-4 text-gray-700 font-medium">{{ getDate(log) || '—' }}</td>
              </tr>
            </tbody> -->

          </table>
        </div>
      </div>

      <!-- Estado vacío mejorado con mejor diseño -->
      <ng-template #noSimulations>
        <div class="mt-4 p-8 text-center">
          <div class="inline-block p-4 bg-gray-100 rounded-full mb-4">
            <svg class="w-12 h-12 text-slate-300 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
          <p class="text-gray-600 font-medium text-lg">No se encontraron registros</p>
          <p class="text-gray-500 text-sm mt-1">Ajusta los filtros o intenta más tarde</p>
        </div>
      </ng-template>
    </div>
  </div>
</div>

<style>
  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(-4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .animate-fadeIn {
    animation: fadeIn 0.3s ease-out;
  }
</style>
