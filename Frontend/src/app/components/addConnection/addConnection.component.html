<div class="max-w-4xl mx-auto p-6 bg-white">
    <!-- ✅ Alerta tipo TOAST -->
    <div
        *ngIf="alertVisible"
        [ngClass]="{
        'bg-green-100 border border-green-500 text-green-700': alertType === 'success',
        'bg-orange-100 border border-orange-500 text-orange-700': alertType === 'error'
        }"
        class="fixed top-4 left-1/2 transform -translate-x-1/2 w-11/12 md:w-1/2 p-4 rounded-md shadow-lg transition-all duration-500 ease-in-out z-50"
        [class.opacity-100]="alertVisible"
        [class.opacity-0]="!alertVisible"
        role="alert"
    >
        <div class="flex justify-between items-start">
        <div>
            <p class="font-bold">
            {{ alertType === 'success' ? 'Éxito' : 'Error' }}
            </p>
            <p>{{ alertMessage }}</p>
        </div>

        <!-- Botón para cerrar manualmente -->
        <button
            (click)="closeAlert()"
            class="text-gray-500 hover:text-gray-700 ml-4"
        >
            ✖
        </button>
        </div>
    </div>

    <!-- Header -->
    <div class="mb-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-2">Añadir Tipos de Conexión</h1>
        <p class="text-gray-600">Configura los parámetros de conexión para los servidores</p>
    </div>

    <!-- ✅ Alerta dinámica con Tailwind
    <div
        *ngIf="alertVisible"
        [ngClass]="{
        'bg-green-100 border-l-4 border-green-500 text-green-700': alertType === 'success',
        'bg-orange-100 border-l-4 border-orange-500 text-orange-700': alertType === 'error'
        }"
        class="p-4 rounded-md shadow-sm mb-6 transition-all duration-300"
        role="alert"
    >
        <p class="font-bold">
        {{ alertType === 'success' ? 'Éxito' : 'Error' }}
        </p>
        <p>{{ alertMessage }}</p>
    </div> -->

    <form class="space-y-8" (ngSubmit)="onSubmit($event)">
        <!-- Connection Section -->
        <div class="bg-gray-50 rounded-lg p-6">
            <h2 class="text-xl font-medium text-gray-900 mb-2">Conexiones</h2>
            <p class="text-gray-600 mb-6">Ingrese los parámetros necesarios para registrar una nueva conexión</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre del servidor
                    </label>
                    <select
                        id="servidor"
                        name="servidor"
                        [(ngModel)]="selectedServer"
                        class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                    >
                        <option value="">Seleccionar...</option>
                        <option *ngFor="let s of servers" [value]="s.name">{{ s.name }}</option>
                    </select>
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Tipo de conexión
                    </label>
                    <select
                        id="conexión"
                        [(ngModel)]="conexion"
                        name="conexión"
                        class="w-full max-w-xs px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white"
                    >
                        <option value="">Seleccionar...</option>
                        <option value="SMPP">SMPP</option>
                        <option value="MQ">MQ</option>
                    </select>
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Nombre de la Conexión
                    </label>
                    <input
                            type="text"
                            id="nombre"
                            [(ngModel)]="nombre"
                            name="nombre"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="10.10.25.63"
                        >
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-2">
                        Puerto de Conexión
                    </label>
                    <input
                            type="text"
                            id="puerto"
                            [(ngModel)]="puerto"
                            name="puerto"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="10.10.25.63"
                        >
                </div>
            </div>
        </div>

        <!-- Submit Button -->
        <div class="flex justify-end">
            <button
                type="submit"
                class="px-6 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors duration-200"
            >
                Añadir Conexión
            </button>
        </div>
    </form>
</div>
