<!-- app.component.html -->
<router-outlet></router-outlet>

<div
  *ngIf="authService.sessionExpired$ | async"
  class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-40 z-50 backdrop-blur-sm animate-fade-in"
>
  <div class="bg-white px-10 py-8 rounded-2xl shadow-2xl w-full max-w-md text-center animate-scale-in">
    <div class="flex justify-center mb-4">
      <div class="w-14 h-14 flex items-center justify-center rounded-full bg-red-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </div>
    </div>

    <h2 class="text-2xl font-bold text-slate-800 mb-2">Sesión expirada</h2>
    <p class="text-slate-600 text-sm mb-6">
      {{ sessionExpiredMessage }}
    </p>

    <div class="flex justify-center gap-4">
      <button
        (click)="onConfirmSessionExpiration()"
        class="px-6 py-2 bg-red-600 text-white font-medium rounded-lg hover:bg-red-700 hover:shadow-lg transition-all duration-200"
      >
        Iniciar sesión
      </button>
    </div>
  </div>
</div>
