version: '3.9'

services:
  # 🗄️ Base de datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: tedexis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_tedexis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jg081101
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - laravel

  # 🍃 MongoDB
  mongodb:
    image: mongo:7.0-jammy
    container_name: tedexis_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: app
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - laravel

  # ⚙️ Angular Builder
  angular:
    image: node:20-alpine
    container_name: tedexis_angular_builder
    restart: "no"
    working_dir: /usr/src/app
    command: sh -c "npm ci --prefer-offline && npm run build -- --configuration=production"
    volumes:
      - ./Frontend:/usr/src/app
      - angular_cache:/usr/src/app/node_modules
    networks:
      - laravel

  # 🧩 Backend Laravel
  app:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tedexis_laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./Backend:/var/www
    environment:
      - APP_ENV=development
      - APP_DEBUG=false
      - APP_URL=https://localhost
      - LOG_CHANNEL=stack
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=db_tedexis
      - DB_USERNAME=postgres
      - DB_PASSWORD=jg081101
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync
    expose:
      - "9000"
    networks:
      - laravel
    depends_on:
      - postgres

  # 🧵 Worker de colas
  queue:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tedexis_laravel_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=120
    volumes:
      - ./Backend:/var/www
    environment:
      - APP_ENV=production
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
    networks:
      - laravel
    depends_on:
      - app
      - postgres

  # 🧩 Microservicio MongoDB Bridge
  mongo-bridge:
    build:
      context: ./MongoBridge
      dockerfile: Dockerfile
    container_name: tedexis_mongo_bridge
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./MongoBridge/storage/logs:/var/www/storage/logs
    networks:
      - laravel
    depends_on:
      - mongodb

  # 🌐 Nginx (espera 20 segundos para que todo esté listo)
  nginx:
    image: nginx:1.25-alpine
    container_name: tedexis_nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf.d/app.config:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./Frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - ./Backend:/var/www:ro
    networks:
      - laravel
    depends_on:
      - app
      - angular
    command: >
      sh -c "sleep 20 && nginx -g 'daemon off;'"

networks:
  laravel:
    driver: bridge

volumes:
  pgdata:
    driver: local
  mongodb_data:
    driver: local
  angular_cache:
    driver: local
